[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "solaris-memory-mcp"
version = "0.1.0"
description = "Solaris memory substrate MCP server"
readme = "README.md"
license = {text = "MPL-2.0"}
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "mcp>=1.0.0",
  "numpy>=1.26",
  "pydantic>=2.8",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "pytest>=8.0",
]

[project.scripts]
solaris-server = "solaris.server:main"
solaris-web = "solaris.web_app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
